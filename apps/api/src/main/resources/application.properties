spring.application.name=api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/steves_lab}
spring.datasource.username=${DATABASE_USERNAME:steves_lab}
spring.datasource.password=${DATABASE_PASSWORD:steves_lab}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:change-this-local-password}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}
app.storage.region=${S3_REGION:eu-west-2}
app.storage.bucket=${S3_BUCKET:steves-lab-media}
app.storage.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.secret-key=${S3_SECRET_KEY:minioadmin}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
