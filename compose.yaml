services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: steves_lab
      POSTGRES_USER: steves_lab
      POSTGRES_PASSWORD: steves_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steves_lab -d steves_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/steves_lab
      DATABASE_USERNAME: steves_lab
      DATABASE_PASSWORD: steves_lab
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: steves-lab-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  minio-data:
  postgres-data: